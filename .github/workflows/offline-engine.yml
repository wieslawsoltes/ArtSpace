name: Offline engine validation
on:
  push:
    branches: [feat/opacity-masks-svg-fidelity]
    paths: ['.github/workflows/offline-engine.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore tests/ArtSpace.Tests
      - name: Bundle resolved compiler and engine dependencies only
        run: |
          python3 - <<'PY'
          import os,json,tarfile
          from pathlib import Path
          root=Path(os.environ['DOTNET_ROOT'])
          assets=json.loads(Path('tests/ArtSpace.Tests/obj/project.assets.json').read_text())
          def keep(info):
            if '/DotnetTools' in info.name or '/FSharp' in info.name or info.name.endswith('.nupkg'): return None
            return info
          with tarfile.open('/tmp/engine.tar.gz','w:gz',compresslevel=6) as output:
            output.add(root/'dotnet',arcname='dotnet/dotnet')
            output.add(root/'sdk'/'10.0.401',arcname='dotnet/sdk/10.0.401',filter=keep)
            for relative in ['host/fxr','shared/Microsoft.NETCore.App','packs/Microsoft.NETCore.App.Ref','packs/Microsoft.NETCore.App.Host.linux-x64','packs/NETStandard.Library.Ref']:
              directory=root/relative
              if directory.exists():
                for version in directory.iterdir():
                  if version.name.startswith('10.0.') or relative.endswith('NETStandard.Library.Ref'):
                    output.add(version,arcname='dotnet/'+relative+'/'+version.name,filter=keep)
            for name, library in assets['libraries'].items():
              if library.get('type') != 'package': continue
              for folder in assets['packageFolders']:
                p=Path(folder)/library['path']
                if p.exists():
                  print('Include',p)
                  output.add(p,arcname='nuget/packages/'+library['path'],filter=keep)
                  break
          print('Archive bytes:',Path('/tmp/engine.tar.gz').stat().st_size)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ArtSpace-offline-engine
          path: /tmp/engine.tar.gz
          compression-level: 0
          retention-days: 1
