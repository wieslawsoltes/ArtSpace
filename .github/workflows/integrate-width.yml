name: Integrate width editing
on:
  push:
    branches: [feat/variable-width-strokes]
    paths: ['.github/workflows/integrate-width.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/variable-width-strokes
      - name: Refine reviewed stroke boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); text=p.read_text()
              if new in text: return
              assert text.count(old)==1, (path,old[:80],text.count(old))
              p.write_text(text.replace(old,new,1))
          for name in ['LiveAppearanceTests.cs','AppearanceRegressionTests.cs']:
              p=Path('tests/ArtSpace.Tests')/name; text=p.read_text()
              text=text.replace('\\"formatVersion\\":4','\\"formatVersion\\":5').replace('schema four on save','the current schema on save')
              p.write_text(text)
          p='tests/ArtSpace.Tests/LiveAppearanceTests.cs'
          r(p,'foreach (var version in new[] { 1, 2, 3 })','foreach (var version in new[] { 1, 2, 3, 4 })')
          p='tests/ArtSpace.Tests/Program.cs'
          r(p,'VariableStrokeTests.Register(Test);','VariableStrokeTests.Register(Test);\nStrokeBoundaryTests.Register(Test);')
          r(p,'if (args.Contains("--spatial-benchmark"))','if (args.Contains("--stroke-benchmark")) return VariableStrokeBenchmarks.Run();\n\nif (args.Contains("--spatial-benchmark"))')
          p='src/ArtSpace.Skia/SceneRenderer.Strokes.cs'
          r(p,'        public double PickTolerance;','        public double PickTolerance;\n        public Matrix2D PickMatrix;')
          r(p,'private sealed record CenterlineEntry(GeometrySnapshot Geometry, VariableStrokeGeometry.Contour[] Contours);','private sealed record CenterlineEntry(GeometrySnapshot Geometry, VariableStrokeGeometry.Contour[] Contours, int SampleCount);')
          r(p,'    private int _strokeGeometryPoints;','    private int _strokeGeometryPoints, _strokePickPoints, _strokeCenterlineSamples;\n    public int CachedStrokeCenterlineSamples => _strokeCenterlineSamples;\n    public int CachedStrokePickPoints => _strokePickPoints;')
          r(p,'        if (_strokeCenterlines.Count >= 256) _strokeCenterlines.Remove(_strokeCenterlines.Keys.First());\n        _strokeCenterlines[node.Id] = new(new(node), contours); StrokeCenterlineBuilds++; return contours;','''        RemoveCenterline(node.Id);
                  var count = contours.Sum(c => c.Samples.Length);
                  while (_strokeCenterlines.Count > 0 && (_strokeCenterlines.Count >= 256 || _strokeCenterlineSamples + count > 250_000))
                      RemoveCenterline(_strokeCenterlines.Keys.First());
                  _strokeCenterlines[node.Id] = new(new(node), contours, count); _strokeCenterlineSamples += count;
                  StrokeCenterlineBuilds++; return contours;''')
          file=Path(p); text=file.read_text()
          a=text.index('    private bool StrokeContains('); b=text.index('    private static bool Paintable(',a)
          text=text[:a]+'''    private bool StrokeContains(DesignNode node, StrokeStyle stroke, Vec2 local, Vec2 world, Matrix2D worldMatrix, double tolerance, double localTolerance)
              {
                  var path = StrokeOutline(node, stroke); var bounds = path.TightBounds;
                  bounds.Inflate((float)localTolerance, (float)localTolerance);
                  if (!bounds.Contains((float)local.X, (float)local.Y)) return false;
                  if (path.Contains((float)local.X, (float)local.Y)) return true;
                  if (tolerance <= 0) return false;
                  var entry = _strokeGeometry[(node.Id, stroke)];
                  if (entry.PickBorder is null || entry.PickTolerance != tolerance || entry.PickMatrix != worldMatrix)
                  {
                      // Offset the transformed coverage, not a locally inflated radius: shear/nonuniform
                      // scale must not turn a four-pixel target into a forty-pixel hit zone.
                      using var transformed = new SKPath(path); transformed.Transform(Matrix(worldMatrix));
                      using var paint = new SKPaint { Style = SKPaintStyle.Stroke, StrokeWidth = (float)(tolerance * 2), StrokeCap = SKStrokeCap.Round, StrokeJoin = SKStrokeJoin.Round };
                      var border = paint.GetFillPath(transformed) ?? throw new InvalidOperationException("Cannot create stroke picking coverage.");
                      ReleasePickBorder(entry);
                      StrokePickBuilds++;
                      if (border.PointCount > 1_000_000)
                      {
                          using (border) return border.Contains((float)world.X, (float)world.Y);
                      }
                      foreach (var key in _strokeGeometryLru)
                      {
                          if (_strokePickPoints + border.PointCount <= 1_000_000) break;
                          ReleasePickBorder(_strokeGeometry[key]);
                      }
                      entry.PickBorder = border; entry.PickTolerance = tolerance; entry.PickMatrix = worldMatrix;
                      _strokePickPoints += border.PointCount;
                  }
                  return entry.PickBorder.Contains((float)world.X, (float)world.Y);
              }

              private void ReleasePickBorder(StrokeGeometryEntry entry)
              {
                  if (entry.PickBorder is not { } border) return;
                  _strokePickPoints -= border.PointCount; border.Dispose(); entry.PickBorder = null;
              }
              private void RemoveCenterline(string id)
              {
                  if (_strokeCenterlines.Remove(id, out var entry)) _strokeCenterlineSamples -= entry.SampleCount;
              }

          '''+text[b:]; file.write_text(text)
          r(p,'StrokeContains(node, stroke, local, localTolerance)','StrokeContains(node, stroke, local, point, matrix, tolerance, localTolerance)')
          r(p,'        _strokeGeometryPoints -= entry.Path.PointCount;','        ReleasePickBorder(entry);\n        _strokeGeometryPoints -= entry.Path.PointCount;')
          r(p,'if (!ids.Contains(id)) _strokeCenterlines.Remove(id);','if (!ids.Contains(id)) RemoveCenterline(id);')
          r(p,'_strokeCenterlines.Clear(); _strokeGeometryPoints = 0;','_strokeCenterlines.Clear(); _strokeGeometryPoints = _strokePickPoints = _strokeCenterlineSamples = 0;')
          p='src/ArtSpace.Skia/VariableStrokeGeometry.cs'
          r(p,'        public double Length => Samples.Length == 0 ? 0 : Samples[^1].Distance;','        public double Length => Samples.Length == 0 ? 0 : Samples[^1].Distance;\n        public bool HasSegments { get; init; } = true;')
          r(p,'contours.Add(new(samples.ToArray(), contour.Closed));','contours.Add(new(samples.ToArray(), contour.Closed) { HasSegments = count > 0 });')
          r(p,'                if (contour.Length <= 1e-10 || stroke.Width <= 0) continue;','''                if (stroke.Width <= 0) continue;
                          if (contour.Length <= 1e-10)
                          {
                              if (contour.HasSegments && !contour.Closed && contour.Samples.Length > 0)
                              {
                                  var width = StrokeProfiles.Evaluate(stroke.WidthProfile, 0);
                                  var sides = (width.Left * stroke.Width, width.Right * stroke.Width);
                                  Cap(contour.Samples[0].Point, new(-1, 0), sides, true);
                                  Cap(contour.Samples[0].Point, new(1, 0), sides, false);
                              }
                              continue;
                          }''')
          p='src/ArtSpace.Illustration/StrokeProfileOperations.cs'; file=Path(p); text=file.read_text()
          a=text.index('    public static int Insert('); b=text.index('    public static void UpdatePoint(',a)
          text=text[:a]+'''    public static int Insert(StrokeStyle stroke, double position) => StrokeProfiles.Insert(stroke.WidthProfile, position);

          '''+text[b:]; file.write_text(text)
          p='src/ArtSpace.Editor/DesignSurface.Width.cs'; file=Path(p); text=file.read_text()
          text=text.replace('ex is InvalidOperationException or ArgumentException','ex is InvalidOperationException or InvalidDataException or ArgumentException')
          text=text.replace('        foreach (var handle in WidthHandles)\n        {\n            var center', '        using var diamond = new SKPath();\n        foreach (var handle in WidthHandles)\n        {\n            var center')
          text=text.replace('            using var diamond = new SKPath(); diamond.MoveTo(', '            diamond.Reset(); diamond.MoveTo(')
          file.write_text(text)
          r('src/ArtSpace.Controls/IconView.cs','        ["directselect"] =','        ["width"] = "M3 3C10 8 10 16 3 21M21 3C14 8 14 16 21 21M3 12H21M3 12L6 9M3 12L6 15M21 12L18 9M21 12L18 15",\n        ["directselect"] =')
          r('src/ArtSpace.Workbench/StudioWorkbench.Illustration.cs','(EditorTool.Width,"scale","Width (Shift W)")','(EditorTool.Width,"width","Width (Shift W)")')
          p='.github/workflows/build.yml'
          r(p,'          cat artifacts/benchmarks/spatial-replay.json','          cat artifacts/benchmarks/spatial-replay.json\n          dotnet run --project tests/ArtSpace.Tests -c Release --no-build -- --stroke-benchmark > artifacts/benchmarks/stroke-coverage.json\n          cat artifacts/benchmarks/stroke-coverage.json')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows/build.yml
          git diff --cached --quiet || git commit -m 'Bound stroke caches, correct world-space tolerance, and cover degenerate stroke and mask cases'
          git push origin HEAD:feat/variable-width-strokes
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run engine and geometry regressions
        run: dotnet run --project tests/ArtSpace.Tests -c Release
      - name: Stroke coverage benchmark
        run: dotnet run --project tests/ArtSpace.Tests -c Release --no-build -- --stroke-benchmark
      - name: Build shared desktop host
        run: |
          python3 scripts/fetch-assets.py
          dotnet build src/ArtSpace.App -c Release -f net10.0-desktop -p:ArtSpaceDesktopOnly=true
