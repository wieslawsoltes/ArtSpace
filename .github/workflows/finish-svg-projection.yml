name: Finish SVG interaction and projection
on:
  push:
    branches: [feat/svg-path-text-interchange]
    paths: ['.github/workflows/finish-svg-projection.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/svg-path-text-interchange
      - name: Apply reviewed source and test delta
        run: |
          echo 'ae2942b1106f918a37e0f8ee67b78263021c408bfe6a509349ccec6eeb9ba40c  eng/svg-projection-review.xz' | sha256sum --check --strict
          xz --decompress --stdout eng/svg-projection-review.xz > /tmp/svg-projection.patch
          echo '7ff709bd66b9ac60caa558333b1d10ad044102606a1c68e290ad2f4554fb4930  /tmp/svg-projection.patch' | sha256sum --check --strict
          git apply --check /tmp/svg-projection.patch
          git apply --index /tmp/svg-projection.patch
          git rm eng/svg-projection-review.xz
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Index contour projection and publish authoritative menu navigation without layout work'
          git push origin HEAD:feat/svg-path-text-interchange
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Engine and observer regressions
        run: |
          dotnet run --project tests/ArtSpace.Tests -c Release
          node --test tests/*.test.mjs
      - name: Verify projection reference and compile Uno host
        run: |
          dotnet run --project tests/ArtSpace.Tests -c Release --no-build -- --projection-benchmark
          python3 scripts/fetch-assets.py
          dotnet build src/ArtSpace.App -c Release -f net10.0-desktop -p:ArtSpaceDesktopOnly=true
