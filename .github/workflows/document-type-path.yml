name: Document type on a path
on:
  push:
    branches: [feat/type-on-path]
    paths: ['.github/workflows/document-type-path.yml']
permissions:
  contents: write
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/type-on-path
      - name: Apply focused documentation changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md'); s=p.read_text()
          s=s.replace('**Version: `0.5.0-alpha.1`.**', '**Version: `0.6.0-alpha.1`.**')
          section='''## New in 0.6

          **Editable Type on a Path:** create text along a vector contour or attach existing sibling text, with start/end/center brackets, flip, font-metric alignment, baseline shift and explicit overflow. Direct Selection edits the baseline; Create Outlines converts only on request. The retained inspector preserves ordinary field updates and bracket clicks do not begin undo transactions.

          **Retained path typography:** one glyph geometry layout serves painting, hit testing and outlines. Native arc-length measurements and lazy projection tables are cached separately. Settled text participates in the existing R-tree display list; there is no extra editor framebuffer. SVG export creates outlines on a detached copy, keeping native text editable.

          Read the [Type on a Path guide](docs/type-on-path.md) for APIs, single-contour/shaping boundaries, schema 5, export semantics and reproducible CPU measurements.

          '''
          if '## New in 0.6' not in s: s=s.replace('## New in 0.5',section+'## Appearance and rendering introduced in 0.5')
          s=s.replace('| Text | Basic wrapping, tracking/alignment and Create Outlines using the same glyph runs as painting |','| Text | Basic wrapping, tracking/alignment, editable single-contour Type on a Path and Create Outlines using shared glyph geometry |')
          s=s.replace('Native JSON (schema 4, reading 1–4','Native JSON (schema 5, reading 1–5')
          s=s.replace('**256 engine cases**','**301 engine cases**').replace('**21 browser scenarios**','**24 browser scenarios**')
          s=s.replace('**Native saves use schema 4.** ArtSpace 0.5 reads schemas 1–4','**Native saves use schema 5.** ArtSpace 0.6 reads schemas 1–5')
          s=s.replace('Earlier readers reject schema 4 rather than silently dropping new appearance semantics.','Earlier readers reject schema 5 rather than silently dropping path-text and appearance semantics.')
          s=s.replace('variable-font workflows, type-on-path, gradient meshes','variable-font workflows, threaded/warped path typography, gradient meshes')
          s=s.replace('[Contours/outlines](docs/path-editing.md)', '[Contours/outlines](docs/path-editing.md) · [Type on a Path](docs/type-on-path.md)')
          s=s.replace('dotnet run --project tests/ArtSpace.Tests -c Release --no-build -- --appearance-benchmark\n```','dotnet run --project tests/ArtSpace.Tests -c Release --no-build -- --appearance-benchmark\ndotnet run --project tests/ArtSpace.Tests -c Release --no-build -- --type-on-path-benchmark\n```')
          p.write_text(s)
          p=Path('docs/feature-matrix.md'); s=p.read_text().replace('0.5.0-alpha.1','0.6.0-alpha.1')
          s=s.replace('schema 4','schema 5').replace('schemas 1–4','schemas 1–5').replace('schemas 1-4','schemas 1-5')
          s=s.replace('256 engine','301 engine').replace('21 browser','24 browser')
          if '## Type on a Path — implemented boundary' not in s:
              s+='''\n\n## Type on a Path — implemented boundary

          The tangent-oriented single-contour workflow is implemented in 0.6: creation/attachment, editable baseline, start/end/center brackets, flip, metric alignment, baseline shift, overflow, native persistence, cached rendering/picking and reversible outlines. Any broader typography row above must not be read as saying this basic workflow is absent.

          General shaping/bidi/fallback, multi-contour threading, seam-wrapping intervals, warp variants and native SVG textPath interchange remain unsupported. The workbench exports vector outlines on a detached snapshot; malformed native baselines remain inspectable but cannot silently export missing text. See [Type on a Path](type-on-path.md).

          The current suite registers 301 engine cases and 24 browser scenarios. The completed workflow for a commit, not this count, establishes which tests passed. New software-Skia measurements compare retained path text against forced cache rebuilds; they are not hardware-GPU or older-release FPS claims.
          '''
          p.write_text(s)
          p=Path('docs/architecture.md'); s=p.read_text()
          if '## Retained path typography' not in s:
              s+='''\n\n## Retained path typography

          Schema 5 adds `DesignNode.TextPath` options while keeping text as a Text node and persisting its owned baseline in PathData/PathWidth/PathHeight. Schemas 1–5 remain readable. `TypeOnPathOperations` provides reversible commands; `MeasuredContour` owns one native path measure and a lazy projection table; `PathTextLayout` owns the positioned glyph path. Renderer keys compare exact options/typography/geometry. Font changes clear owned resources; ordinary paint and placement changes preserve layout.

          Drawing, picking and outlines share glyph geometry. Direct Selection edits the baseline, while Selection exposes lazy-transaction text brackets. The existing scene recorder can retain settled output. Arc length, scalar layout and editing remain CPU work; backend hardware selection is unchanged.

          Interactive invalid-baseline failures become cached diagnostics, and exports reject them explicitly. `IllustrationSvgExport` clones requested roots and outlines path text without changing document/history. Normalized float serialization may differ at antialiased edges, so outline interchange uses bounded coverage tests; cached/direct replay is tested with exact pixels. See [ownership, performance and limitations](type-on-path.md).
          '''
          p.write_text(s)
          p=Path('CHANGELOG.md'); s=p.read_text()
          if '## 0.6.0-alpha.1' not in s:
              s=s.replace('# Changelog','# Changelog\n\n## 0.6.0-alpha.1 — 2026-09-29\n\n- Editable tangent-oriented Type on a Path: create/attach, Start/End/center brackets, flip, metric alignment, baseline shift, explicit overflow and direct baseline anchors.\n- Retained glyph geometry shared by drawing, picking and outlines; independent native arc-length/projection caches, exact invalidation and bounded resource accounting.\n- Reversible text/outline/area-text conversion, linked-symbol compatibility, native schema 5 and safe diagnostic behavior for malformed baselines.\n- SVG outline export on detached snapshots, shifted-ink export bounds and preservation of text gradient coordinate spaces. Native SVG textPath import remains explicitly unsupported.\n- 45 additional engine regressions and three real Uno browser scenarios, plus alternating-order CPU cache measurements with exact reference pixels.\n- Existing scene replay, release packaging and NuGet Trusted Publishing remain unchanged. This is not complete Illustrator typography/UI parity or a physical-GPU benchmark.\n',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/architecture.md docs/feature-matrix.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'Document type-on-path workflows, schema 5 and retained typography contracts'
            git push origin HEAD:feat/type-on-path
          fi
