name: Integrate SVG path text
on:
  push:
    branches: [feat/svg-path-text-interchange]
    paths: ['.github/workflows/integrate-svg.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/svg-path-text-interchange
      - name: Apply exact locally validated source delta
        run: |
          cat eng/svg-interchange/*.part > /tmp/svg-interchange.xz
          echo 'e9e02ec24b120be8eb4cfe47024a4cf9bd1dfd92172427bea85d84670234da4a  /tmp/svg-interchange.xz' | sha256sum --check --strict
          xz --decompress --stdout /tmp/svg-interchange.xz > /tmp/svg-interchange.patch
          git apply --check /tmp/svg-interchange.patch
          git apply --index /tmp/svg-interchange.patch
          git diff --cached --check
          git rm -r eng/svg-interchange
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement editable SVG path text, anchor positioning and allocation-free glyph append'
          git push origin HEAD:feat/svg-path-text-interchange
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Geometry, interchange and host-adapter regressions
        run: |
          node --test tests/keyboard-bridge.test.mjs
          dotnet run --project tests/ArtSpace.Tests -c Release
      - name: Compile native Uno integration
        run: |
          python3 scripts/fetch-assets.py
          dotnet build src/ArtSpace.App -c Release -f net10.0-desktop -p:ArtSpaceDesktopOnly=true
