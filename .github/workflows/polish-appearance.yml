name: Polish appearance integration
on:
  push:
    branches: [feat/appearance-gpu-parity]
    paths: ['.github/workflows/polish-appearance.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/appearance-gpu-parity
      - name: Apply reviewed caption and observation refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {'src/ArtSpace.Controls/NumericField.cs': '674f51dfd347bc64b43c1b69fb0f71f4dc7c972a', 'src/ArtSpace.App/Platforms/WebAssembly/BrowserWorkspaceStorage.cs': '48f5a682e86e0c8c20ae8fb5916e9b63b9fb91cd', 'src/ArtSpace.App/Platforms/WebAssembly/WasmScripts/Storage.js': 'b12ce7b072c937c80d99637c7ff9645df7e13bf6', 'tests/browser/live-appearance.spec.mjs': '9efb83a8d280deee2721e48978361aaad40b8224', 'tests/browser/ui-performance.spec.mjs': '7d9d5d4197454d73eace38f256c26e74bd925869', 'scripts/compare-ui-baseline.sh': 'd874310b34baf748c363470baf4ab4dd41c66bf5', 'docs/appearance-rendering.md': '253d5aa1afabc19491465a7b077c259a1f2afea7'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == sha, path
          def replace(path, old, new, count=1):
              file=Path(path); text=file.read_text()
              assert text.count(old)==count, (path, old[:80], text.count(old))
              file.write_text(text.replace(old,new))
          replace('src/ArtSpace.Controls/NumericField.cs', '_prefix = new Border { Width = 28, Background', '_prefix = new Border { MinWidth = 28, MaxWidth = 120, Background')
          replace('src/ArtSpace.Controls/NumericField.cs', 'Padding = new(8, 0, 0, 0)', 'Padding = new(8, 0, 6, 0)')
          replace('src/ArtSpace.Controls/NumericField.cs', 'var grid = Studio.Columns((_prefix, 28), (_input, -1)); grid.ColumnSpacing = 0;', 'ToolTipService.SetToolTip(_prefix, label);\n        var grid = Studio.Columns((_prefix, 28), (_input, -1)); grid.ColumnSpacing = 0;\n        grid.ColumnDefinitions[0].Width = GridLength.Auto;\n        SizeChanged += (_, e) =>\n        {\n            // Fit descriptive labels without consuming the editable numeric area in compact rows.\n            var width = Math.Max(28, Math.Min(120, e.NewSize.Width * .48));\n            if (_prefix.MaxWidth != width) _prefix.MaxWidth = width;\n        };')
          replace('src/ArtSpace.App/Platforms/WebAssembly/BrowserWorkspaceStorage.cs', '    internal static partial void PublishDiagnostics(string json);', '    internal static partial void PublishDiagnostics(string json);\n    [JSImport("globalThis.artSpaceStorage.publishFrameDiagnostics")]\n    internal static partial void PublishFrameDiagnostics(double sceneRecordings, double sceneReplays,\n        double sceneBytes, double paintBuilds, double dashBuilds, double effectFilterBuilds,\n        double gradientBuilds, double geometryBuilds, double culledNodes);')
          replace('src/ArtSpace.App/Platforms/WebAssembly/BrowserWorkspaceStorage.cs', '        if (!BrowserFiles.IsTestMode()) return;\n        void Publish()', '        if (!BrowserFiles.IsTestMode()) return;\n        ArtSpace.Core.DesignPage? countedPage = null;\n        var countsDirty = true;\n        var nodeCount = 0; var maskCount = 0; var clipCount = 0;\n        long sceneScans = 0, publishes = 0;\n        void RefreshCounts()\n        {\n            if (!countsDirty && ReferenceEquals(countedPage, session.Page)) return;\n            countedPage = session.Page;\n            nodeCount = maskCount = clipCount = 0;\n            foreach (var node in countedPage.AllNodes())\n            {\n                nodeCount++;\n                if (node.OpacityMaskId is not null) maskCount++;\n                if (node.ClipPathId is not null) clipCount++;\n            }\n            countsDirty = false; sceneScans++;\n        }\n        void Publish()')
          replace('src/ArtSpace.App/Platforms/WebAssembly/BrowserWorkspaceStorage.cs', '            var primary = session.Primary;', '            RefreshCounts(); publishes++;\n            var primary = session.Primary;')
          replace('src/ArtSpace.App/Platforms/WebAssembly/BrowserWorkspaceStorage.cs', 'json.WriteNumber("nodes", session.Page.AllNodes().Count())', 'json.WriteNumber("nodes", nodeCount)')
          replace('src/ArtSpace.App/Platforms/WebAssembly/BrowserWorkspaceStorage.cs', 'json.WriteNumber("opacityMasks", session.Page.AllNodes().Count(n => n.OpacityMaskId is not null))', 'json.WriteNumber("opacityMasks", maskCount)')
          replace('src/ArtSpace.App/Platforms/WebAssembly/BrowserWorkspaceStorage.cs', 'json.WriteNumber("clipGroups", session.Page.AllNodes().Count(n => n.ClipPathId is not null));', 'json.WriteNumber("clipGroups", clipCount);\n                json.WriteNumber("diagnosticSceneScans", sceneScans);\n                json.WriteNumber("diagnosticPublishes", publishes);')
          replace('src/ArtSpace.App/Platforms/WebAssembly/BrowserWorkspaceStorage.cs', 'foreach (var field in workbench.InspectorFields.Concat(workbench.AppearanceFields))', 'foreach (var field in workbench.ActivePanel == "Properties" ? workbench.InspectorFields : workbench.AppearanceFields)')
          replace('src/ArtSpace.App/Platforms/WebAssembly/BrowserWorkspaceStorage.cs', '        session.Changed += (_, _) => QueuePublish();\n        workbench.UiRefreshed += QueuePublish;\n        workbench.Surface.FrameRendered += QueuePublish;', '        session.Changed += (_, change) =>\n        {\n            // Previews can add/remove nodes inside a transaction before DocumentRevision changes.\n            if (change.Kind is EditorChangeKind.Document or EditorChangeKind.Preview) countsDirty = true;\n            QueuePublish();\n        };\n        workbench.UiRefreshed += QueuePublish;\n        workbench.Surface.FrameRendered += () =>\n        {\n            if (workbench.IsDisposed) return;\n            var renderer = workbench.Surface.Renderer;\n            // Keep real post-render counters without another traversal, control walk or JSON snapshot.\n            // Session/layout/UI events still publish the complete actual-control state separately.\n            BrowserFiles.PublishFrameDiagnostics(renderer.SceneRecordings, renderer.SceneReplays,\n                renderer.RetainedSceneBytes, renderer.PaintBuilds, renderer.DashBuilds,\n                renderer.EffectFilterBuilds, renderer.GradientBuilds, renderer.GeometryBuilds, renderer.CulledNodes);\n        };')
          replace('src/ArtSpace.App/Platforms/WebAssembly/WasmScripts/Storage.js', '    publishDiagnostics: json => { if (new URLSearchParams(location.search).get("test") === "1") globalThis.__artSpaceState = Object.freeze(JSON.parse(json)); }', '    publishDiagnostics: json => { if (new URLSearchParams(location.search).get("test") === "1") globalThis.__artSpaceState = Object.freeze(JSON.parse(json)); },\n    publishFrameDiagnostics: (sceneRecordings, sceneReplays, sceneBytes, paintBuilds, dashBuilds, effectFilterBuilds, gradientBuilds, geometryBuilds, culledNodes) => {\n      if (new URLSearchParams(location.search).get("test") !== "1") return;\n      const current = globalThis.__artSpaceState;\n      if (!current) return; // Never advertise readiness with a partial frame-only observation.\n      globalThis.__artSpaceState = Object.freeze({ ...current, sceneRecordings, sceneReplays,\n        sceneBytes, paintBuilds, dashBuilds, effectFilterBuilds, gradientBuilds, geometryBuilds, culledNodes });\n    }')
          replace('tests/browser/live-appearance.spec.mjs', "import fs from 'node:fs/promises';", "import fs from 'node:fs/promises';\nimport vm from 'node:vm';")
          replace('tests/browser/live-appearance.spec.mjs', "test('unchanged scene is replayed during selection without rerecording paints or geometry', async ({ page }) => {", "test('unchanged scene is replayed during selection without rerecording paints or geometry', async ({ page }) => {\n  // Test the read-only host adapter as well: frame patches cannot replace UI observations.\n  const script = await fs.readFile('src/ArtSpace.App/Platforms/WebAssembly/WasmScripts/Storage.js', 'utf8');\n  for (const search of ['', '?test=1']) {\n    const context = vm.createContext({ URLSearchParams, location: { search }, document: { addEventListener() {} } });\n    vm.runInContext(script, context);\n    const adapter = context.artSpaceStorage;\n    adapter.publishFrameDiagnostics(1, 2, 3, 4, 5, 6, 7, 8, 9);\n    expect(context.__artSpaceState).toBeUndefined();\n    adapter.publishDiagnostics(JSON.stringify({ ready: true, id: 'selected', inspectorFields: [{ value: '19' }] }));\n    if (!search) {\n      adapter.publishFrameDiagnostics(1, 2, 3, 4, 5, 6, 7, 8, 9);\n      expect(context.__artSpaceState).toBeUndefined();\n      continue;\n    }\n    const previous = context.__artSpaceState;\n    adapter.publishFrameDiagnostics(1, 2, 3, 4, 5, 6, 7, 8, 9);\n    expect(context.__artSpaceState.id).toBe('selected');\n    expect(context.__artSpaceState.inspectorFields).toBe(previous.inspectorFields);\n    expect(context.__artSpaceState.sceneReplays).toBe(2);\n    expect(previous.sceneReplays).toBeUndefined();\n    expect(Object.isFrozen(context.__artSpaceState)).toBe(true);\n  }")
          replace('tests/browser/live-appearance.spec.mjs', '  expect(end.paintBuilds).toBe(warm.paintBuilds);', '  expect(end.paintBuilds).toBe(warm.paintBuilds);\n  expect(warm.diagnosticSceneScans).toBeGreaterThan(0);\n  expect(end.diagnosticSceneScans).toBe(warm.diagnosticSceneScans);')
          replace('tests/browser/ui-performance.spec.mjs', '  for (let i = 0; i < 12; i++) {', '  for (let i = 0; i < 32; i++) {')
          replace('tests/browser/ui-performance.spec.mjs', 'medianMs: sorted[Math.floor(sorted.length / 2)]', 'medianMs: (sorted[Math.floor((sorted.length - 1) / 2)] + sorted[Math.floor(sorted.length / 2)]) / 2')
          replace('tests/browser/ui-performance.spec.mjs', 'snapshots: final.snapshots };', 'snapshots: final.snapshots, diagnosticSceneScans: final.diagnosticSceneScans, diagnosticPublishes: final.diagnosticPublishes };')
          replace('scripts/compare-ui-baseline.sh', "assert a['nodes'] == b['nodes']", "assert a['nodes'] == b['nodes']\nassert len(a['samplesMs']) == len(b['samplesMs'])\nimport statistics\nassert a['medianMs'] == statistics.median(a['samplesMs'])\nassert b['medianMs'] == statistics.median(b['samplesMs'])")
          replace('scripts/compare-ui-baseline.sh', "  'note': 'One paired CI experiment, software graphics, 12 samples per variant. Baseline runs after optimized. Optimized also waits for matching inspector control diagnostics; not a hardware presentation or stable FPS claim.'", "  'samplesPerVariant': len(a['samplesMs']),\n  'note': 'One sequential paired CI experiment on software graphics. Baseline runs after optimized. Both variants wait for matching inspector controls when available. Diagnostics implementation differs between builds, so this is not an instrumentation-neutral benchmark or a hardware presentation/FPS claim.'")
          replace('docs/appearance-rendering.md', 'Browser CI uses SwiftShader; hardware performance must be measured separately.', 'Browser CI uses SwiftShader; hardware performance must be measured separately.\n\nNumeric field captions use content-sized prefixes bounded by available width, preserving room for input in compact rows. Opt-in diagnostics cache aggregate document counts until a document/preview change; rendered frames update only renderer counters rather than re-walking all nodes and controls. Model, UI and layout changes continue to publish actual control values and bounds. Normal use has no diagnostics subscription.\n\nThe selection experiment records 32 samples per variant, averages the middle two samples for an even-sized median, and reports nearest-rank p95. The baseline is run after the optimized variant. Different diagnostic implementations and sequential host load are confounders; changes in this instrumented experiment must not be attributed solely to GPU acceleration. Functional tests independently require unchanged selection to reuse the native picture and avoid new paint builds and document scans.')
          PY
          node --check src/ArtSpace.App/Platforms/WebAssembly/WasmScripts/Storage.js
          node --check tests/browser/live-appearance.spec.mjs
          node --check tests/browser/ui-performance.spec.mjs
          bash -n scripts/compare-ui-baseline.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts/compare-ui-baseline.sh docs/appearance-rendering.md
          git commit -m 'Fit numeric captions and remove repeated diagnostic scene traversal; strengthen sampling and host-observation tests'
          git push origin HEAD:feat/appearance-gpu-parity
