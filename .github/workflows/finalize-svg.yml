name: Finalize SVG character spacing
on:
  push:
    branches: [feat/svg-path-text-interchange]
    paths: ['.github/workflows/finalize-svg.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/svg-path-text-interchange
      - name: Apply exact validated spacing and reference-test delta
        run: |
          echo 'd8bcb6d4fc0d4671e98fabed28a8156d9f16f26e873d7ca0181c79dd80e18be9  eng/svg-spacing-fix.xz' | sha256sum --check --strict
          xz --decompress --stdout eng/svg-spacing-fix.xz > /tmp/svg-spacing.patch
          git apply --check /tmp/svg-spacing.patch
          git apply --index /tmp/svg-spacing.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md'); s=p.read_text().replace('**301 engine cases**','**361 engine cases**').replace('**24 browser scenarios**','**30 browser scenarios (29 application workflows and one independent SVG reference)**'); p.write_text(s)
          p=Path('docs/feature-matrix.md'); s=p.read_text().replace('301 engine cases','361 engine cases').replace('24 real Uno browser scenarios','29 real Uno browser scenarios plus one independent browser SVG reference').replace('No cross-seam wrapping, multiple-contour flow','No native-bracket seam wrapping or multiple-contour flow').replace('native bracket-overflow editable export are not supported','native bracket-overflow/nonzero-tracking editable export are not supported'); p.write_text(s)
          p=Path('src/ArtSpace.Editor/DesignSurface.TypeOnPath.cs'); s=p.read_text().replace('0=start, 1=end, 2=center.','0=start, 1=end, 2=center, 3=SVG anchor.')
          old='        if (Renderer.GetTypeOnPathStatus(node).Error is not null) return [];\n        var svg = options.SvgPosition;\n        var svgFraction = svg is null ? 0 : svg.Resolve(Renderer.GetTypeOnPathStatus(node).PathLength) / Renderer.GetTypeOnPathStatus(node).PathLength;'
          new='        var status = Renderer.GetTypeOnPathStatus(node);\n        if (status.Error is not null) return [];\n        var svg = options.SvgPosition;\n        var svgFraction = svg is null ? 0 : svg.Resolve(status.PathLength) / status.PathLength;'
          assert old in s; s=s.replace(old,new).replace('        for (var i = 0; i < result.Length; i++)\n        {','        var world = node.WorldMatrix;\n        for (var i = 0; i < result.Length; i++)\n        {').replace('node.WorldMatrix.Map(sample.Position)','world.Map(sample.Position)').replace('node.WorldMatrix.Map(sample.Position + sample.Tangent)','world.Map(sample.Position + sample.Tangent)'); p.write_text(s)
          PY
          git add src tests README.md docs
          git rm eng/svg-spacing-fix.xz
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct SVG character-cell tracking, retain native bracket semantics and test browser reference metrics'
          git push origin HEAD:feat/svg-path-text-interchange
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate engine and compile native host
        run: |
          dotnet run --project tests/ArtSpace.Tests -c Release
          python3 scripts/fetch-assets.py
          dotnet build src/ArtSpace.App -c Release -f net10.0-desktop -p:ArtSpaceDesktopOnly=true
