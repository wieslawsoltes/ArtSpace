name: Integrate illustration
on:
  push:
    paths: ['.github/workflows/integrate.yml', 'eng/*.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-illustration
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Materialize final reviewed fixes
        run: |
          python3 eng/integrate-illustration.py
          python3 eng/polish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m 'Fix panel shortcut, swatch layout and artboard acceptance accounting'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive final committed source
        run: git archive --format=zip --output=/tmp/ArtSpace-source.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: ArtSpace-source
          path: /tmp/ArtSpace-source.zip
