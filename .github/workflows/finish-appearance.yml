name: Finish appearance integration
on:
  push:
    branches: [feat/appearance-gpu-parity]
    paths: ['.github/workflows/finish-appearance.yml']
permissions:
  contents: write
concurrency:
  group: finish-appearance-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/appearance-gpu-parity
          fetch-depth: 0
      - name: Merge reviewed main while preserving package documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          def git(*args): return subprocess.check_output(['git', *args], text=True)
          reviewed_main = '69642b8a6bd15ea1a0963d721b54211de7c7ffba'
          merged_already = subprocess.run(['git', 'merge-base', '--is-ancestor', reviewed_main, 'HEAD']).returncode == 0
          if not merged_already:
              ours = git('show', 'HEAD:README.md')
              theirs = git('show', reviewed_main + ':README.md')
              result = subprocess.run(['git', 'merge', '--no-ff', '--no-commit', reviewed_main])
              conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
              if result.returncode and conflicts != ['README.md']:
                  raise RuntimeError('Unexpected merge conflict; refusing automatic resolution: ' + repr(conflicts))
              package_section = re.search(r'(?ms)^## NuGet packages\n.*?(?=^## |\Z)', theirs)
              old_section = re.search(r'(?ms)^## Reusable libraries\n.*?(?=^## |\Z)', ours)
              assert package_section and old_section, 'Expected package documentation sections.'
              section = package_section.group(0).replace('schema 3, reading 1–3', 'schema 4, reading 1–4')
              extra = old_section.group(0).split('Apply non-destructive appearance from another host:', 1)[1]
              replacement = section.rstrip() + '\n\n### Live appearance from another host\n\n' + extra.strip() + '\n\n'
              merged = ours[:old_section.start()] + replacement + ours[old_section.end():]
              badges = '\n'.join(line for line in theirs.splitlines() if line.startswith(('[![NuGet]', '[![Downloads]')))
              merged = merged.replace('\n</div>', '\n' + badges + '\n\n</div>', 1)
              assert '### ArtSpace.Core' in merged and '### ArtSpace.Workbench' in merged
              assert '## New in 0.5' in merged and 'NuGet Trusted Publishing' in merged
              Path('README.md').write_text(merged)
          p = Path('tests/ArtSpace.Tests/Program.cs'); text = p.read_text()
          if 'SceneSpatialIndexTests.Register(Test);' not in text:
              text = text.replace('LiveAppearanceTests.Register(Test);', 'LiveAppearanceTests.Register(Test);\nSceneSpatialIndexTests.Register(Test);', 1)
          if 'args.Contains("--spatial-benchmark")' not in text:
              text = text.replace('if (args.Contains("--appearance-benchmark"))', 'if (args.Contains("--spatial-benchmark")) return SceneSpatialIndexBenchmarks.Run();\n\nif (args.Contains("--appearance-benchmark"))', 1)
          p.write_text(text)
          for p in [Path('README.md'), Path('docs/appearance-rendering.md'), Path('docs/feature-matrix.md')]:
              text = p.read_text().replace('247 engine', '256 engine').replace('247 registered', '256 registered')
              if p.name == 'README.md' and 'docs/spatial-replay.md' not in text:
                  text = text.replace('## Verification and performance', 'Native replay now uses a clip-aware R-tree index. Changing recording policy releases incompatible commands; increasing the budget retries previously rejected scenes. See [spatial replay and its controlled benchmark](docs/spatial-replay.md).\n\n## Verification and performance')
              p.write_text(text)
          PY
          git add README.md docs/appearance-rendering.md docs/feature-matrix.md tests/ArtSpace.Tests/Program.cs
          if [ -f .git/MERGE_HEAD ] || ! git diff --cached --quiet; then
            git commit -m 'Integrate main package documentation and spatial replay validation'
            git push origin HEAD:feat/appearance-gpu-parity
          fi
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Engine and pixel-equivalence regressions
        run: dotnet run --project tests/ArtSpace.Tests -c Release
      - name: Measure native indexed and linear replay
        run: |
          mkdir -p artifacts/benchmarks
          dotnet run --project tests/ArtSpace.Tests -c Release --no-build -- --spatial-benchmark > artifacts/benchmarks/spatial-replay.json
          cat artifacts/benchmarks/spatial-replay.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ArtSpace-spatial-validation
          path: artifacts/benchmarks
          if-no-files-found: ignore
