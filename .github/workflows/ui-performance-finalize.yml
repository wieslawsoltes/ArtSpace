name: Finalize UI responsiveness
on:
  push:
    branches: [perf/selection-ui-latency]
    paths: ['scripts/finalize-ui-performance.py']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/selection-ui-latency
      - name: Apply guarded input ownership fix
        run: |
          python3 scripts/finalize-ui-performance.py
          rm scripts/finalize-ui-performance.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve explicit contour editing across double taps and synchronize regression observations'
          git push origin HEAD:perf/selection-ui-latency
