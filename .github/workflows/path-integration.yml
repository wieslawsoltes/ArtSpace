name: Path editing integration
on:
  push:
    branches: ['feat/contour-editing-outlines']
    paths: ['eng/integrate-paths.py', '.github/workflows/path-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/contour-editing-outlines
      - name: Apply reviewed integration and commit ordinary source
        run: |
          python3 eng/integrate-paths.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests Directory.Build.props
          git rm eng/integrate-paths.py
          git commit -m 'Integrate contour editing, fill rules, glyph outlines and regressions'
          git push origin HEAD:feat/contour-editing-outlines
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Engine regressions
        run: dotnet run --project tests/ArtSpace.Tests -c Release
      - name: Compile Uno native surface
        run: |
          python3 scripts/fetch-assets.py
          dotnet build src/ArtSpace.App -c Release -f net10.0-desktop -p:ArtSpaceDesktopOnly=true
