name: Finish type input
on:
  push:
    branches: [feat/type-on-path]
    paths: ['.github/workflows/finish-type-input.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/type-on-path
      - name: Materialize guarded input changes
        run: |
          python3 eng/fix-type-input.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git rm eng/fix-type-input.py
          git commit -m 'Fix application input ownership, modal transitions and gesture cancellation'
          git push origin HEAD:feat/type-on-path
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Engine and host-adapter regressions
        run: |
          node --test tests/keyboard-bridge.test.mjs
          dotnet run --project tests/ArtSpace.Tests -c Release
      - name: Compile shared Uno host
        run: |
          python3 scripts/fetch-assets.py
          dotnet build src/ArtSpace.App -c Release -f net10.0-desktop -p:ArtSpaceDesktopOnly=true
