name: Appearance integration
on:
  push:
    branches: [feat/opacity-masks-svg-fidelity]
    paths: ['.github/workflows/appearance-integration.yml', 'src/**', 'tests/**']
permissions:
  contents: read
concurrency:
  group: appearance-engine
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Engine and pixel regressions
        run: dotnet run --project tests/ArtSpace.Tests -c Release
      - name: Native compilation
        run: |
          python3 scripts/fetch-assets.py
          dotnet build src/ArtSpace.App -c Release -f net10.0-desktop -p:ArtSpaceDesktopOnly=true
      - name: Reference performance checks
        run: |
          mkdir -p artifacts/benchmarks
          dotnet run --project tests/ArtSpace.Tests -c Release --no-build -- --benchmark | tee artifacts/benchmarks/cpu.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ArtSpace-appearance-performance
          path: artifacts/benchmarks
          if-no-files-found: ignore
