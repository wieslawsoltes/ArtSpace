name: Type path integration
on:
  push:
    branches: [feat/type-on-path]
    paths: ['.github/workflows/type-path-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/type-on-path
      - name: Materialize reviewed source fixes
        run: |
          if [ -f eng/polish-type-path.py ]; then
            python3 eng/polish-type-path.py
            python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ArtSpace.Tests/Program.cs')
          p.write_text(p.read_text().replace('TypeOnPathTests.Register(Test);','TypeOnPathTests.Register(Test);\nTypeOnPathBoundaryTests.Register(Test);'))
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src tests
            git rm eng/polish-type-path.py
            git commit -m 'Handle malformed baselines safely and preserve path-text export bounds'
            git push origin HEAD:feat/type-on-path
          fi
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Geometry and typography regression suite
        run: dotnet run --project tests/ArtSpace.Tests -c Release
      - name: Reference pixel and CPU cache measurements
        run: |
          mkdir -p artifacts/benchmarks
          dotnet run --project tests/ArtSpace.Tests -c Release --no-build -- --type-on-path-benchmark > artifacts/benchmarks/type-on-path.json
          cat artifacts/benchmarks/type-on-path.json
      - name: Compile native Uno host
        if: always()
        run: |
          python3 scripts/fetch-assets.py
          dotnet build src/ArtSpace.App -c Release -f net10.0-desktop -p:ArtSpaceDesktopOnly=true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ArtSpace-type-path-measurements
          path: artifacts/benchmarks
          if-no-files-found: ignore
